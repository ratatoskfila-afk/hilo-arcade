<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skew</title>
<style>
  :root{ --bg:#0a0b10; --panel:#12141c; --line:#232734; --ink:#e7e9f0; --dim:#7e8697; --accent:#ffd166; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.5 ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px 44px}
  h1{font-size:26px;letter-spacing:.22em;text-transform:uppercase;margin:0 0 2px;font-weight:600}
  .sub{color:var(--dim);font-size:13px;margin-bottom:18px;text-align:center;max-width:580px}
  .wrap{width:100%;max-width:660px}
  .bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .lvl{letter-spacing:.15em;font-size:12px;text-transform:uppercase;color:var(--dim)}
  .msg{font-size:13px;color:var(--accent);min-height:20px;flex:1;text-align:center}
  .stage{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
  canvas{width:100%;height:auto;display:block;margin:0 auto;touch-action:none}
  button{background:#191d28;color:var(--ink);border:1px solid var(--line);border-radius:8px;
    padding:7px 13px;font:inherit;font-size:13px;cursor:pointer}
  button:hover{border-color:#3c4759}
  button:disabled{opacity:.35;cursor:default}
  .roster{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;justify-content:center}
  .who{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);
    background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 11px}
  .who i{width:11px;height:11px;border-radius:50%;display:inline-block}
  .keys{margin-top:16px;color:var(--dim);font-size:12px;text-align:center}
  kbd{background:#191d28;border:1px solid var(--line);border-radius:4px;padding:1px 6px;font:inherit;font-size:11px}
  a{color:var(--dim)}
  @media (max-width:700px){
    body{padding:14px 10px 30px} h1{font-size:21px} .sub{font-size:12px;margin-bottom:12px}
    .stage{padding:8px} button{padding:9px 14px} .keys{font-size:11px}
  }
</style>
</head>
<body>
<h1>Skew</h1>
<div class="sub">You press one direction. Every walker obeys it through its own rotation — press up and
the blue one goes up while the amber one goes right. Land all of them on their pads at once.</div>

<div class="wrap">
  <div class="bar">
    <div class="lvl" id="lvlLabel">Level 1</div>
    <div class="msg" id="msg"></div>
    <div>
      <button id="undoBtn">Undo</button>
      <button id="resetBtn">Reset</button>
      <button id="solveBtn">Solution</button>
    </div>
  </div>

  <div class="stage"><canvas id="cv"></canvas></div>

  <div class="roster" id="roster"></div>

  <div class="keys">
    <kbd>&larr;</kbd><kbd>&darr;</kbd><kbd>&uarr;</kbd><kbd>&rarr;</kbd> or <kbd>WASD</kbd> or
    <b>swipe</b> &middot; <kbd>Z</kbd> undo &middot; <kbd>R</kbd> reset &middot;
    <a href="/" target="_top">back to the arcade</a>
  </div>
</div>

<script>
/* Levels are generated: the arena and the walkers are hand-drawn, but the goal pads were chosen by
   exhaustive breadth-first search over the entire reachable state space. So each level is solvable
   by construction, and `par` is its proven optimal length. `sol` is that optimal move sequence. */
const LEVELS = [
  { name:"Mirror", par:6, sol:"RRRRDD",
    map:["#######","#.....#","#.....#","#.....#","#######"],
    walkers:[{x:1,y:1,s:0},{x:5,y:3,s:2}],
    goals:[{x:5,y:3},{x:1,y:1}] },
  { name:"Right Angle", par:14, sol:"RRRDDDRDLLULDR",
    map:["########","#......#","#..##..#","#..##..#","#......#","########"],
    walkers:[{x:1,y:1,s:0},{x:6,y:1,s:1}],
    goals:[{x:5,y:1},{x:1,y:2}] },
  { name:"Pinwheel", par:16, sol:"RRRRRDRDDDLLUDLL",
    map:["#########","#.......#","#.#...#.#","#...#...#","#.#...#.#","#.......#","#########"],
    walkers:[{x:1,y:1,s:0},{x:7,y:1,s:1},{x:4,y:5,s:2}],
    goals:[{x:7,y:4},{x:2,y:3},{x:5,y:1}] },
  { name:"Minefield", par:18, sol:"UUUUUURRRRRRDDDDLL",
    map:["#########","#.......#","#.ooo...#","#.......#","#...ooo.#","#.......#","#########"],
    walkers:[{x:1,y:1,s:0},{x:7,y:5,s:3}],
    goals:[{x:5,y:5},{x:5,y:3}] },
  { name:"Threadneedle", par:20, sol:"DRDRRUURRRDDULLDDDRR",
    map:["#########","#..#....#","#..#.##.#","#....o..#","#.##.#..#","#....#..#","#########"],
    walkers:[{x:1,y:1,s:0},{x:7,y:1,s:1},{x:1,y:5,s:3}],
    goals:[{x:7,y:5},{x:7,y:4},{x:1,y:2}] },
  { name:"Four Winds", par:26, sol:"RRRRRRDRRDDDDDLUULLLLULRDD",
    map:["#########","#.......#","#.##..#.#","#....#..#","#.#.....#","#..#..#.#","#.....#.#","#..#....#","#########"],
    walkers:[{x:1,y:1,s:0},{x:7,y:1,s:1},{x:7,y:7,s:2},{x:1,y:7,s:3}],
    goals:[{x:4,y:7},{x:4,y:4},{x:1,y:5},{x:7,y:6}] },
  { name:"Pivot", par:18, sol:"UUUURRUUUDRRRLLUDR",
    map:["#########","#...@...#","#.#...#.#","#.......#","#@..o..@#","#.......#","#...@...#","#########"],
    walkers:[{x:1,y:1,s:0},{x:7,y:1,s:1},{x:4,y:5,s:2}],
    goals:[{x:4,y:2},{x:6,y:3},{x:1,y:2}] },
  { name:"Gimbal", par:22, sol:"RRDRRUDDRLUUULLDDRUURR",
    map:["##########","#........#","#.##..##.#","#..@..@..#","#o......o#","#..@..@..#","#.##..##.#","#........#","##########"],
    walkers:[{x:1,y:1,s:0},{x:8,y:1,s:1},{x:8,y:7,s:2}],
    goals:[{x:8,y:3},{x:4,y:7},{x:1,y:5}] },
];

const DIRS = [[0,-1],[1,0],[0,1],[-1,0]];            // up right down left
const COLORS = ['#5ad1ff','#ffb347','#c58cff','#4ade80'];
const CELL = 62;

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let li = 0, grid = [], W = 0, H = 0;
let walkers = [], goals = [], history = [], moves = 0;
let state = 'play';                                   // play | dead | won
let shake = 0, demo = null;

const at = (x,y) => (grid[y] && grid[y][x]) || '#';

function loadLevel(i){
  li = i;
  const L = LEVELS[i];
  grid = L.map.map(r => r.split(''));
  H = grid.length; W = grid[0].length;
  cv.width = W * CELL; cv.height = H * CELL;
  cv.style.maxWidth = (W * CELL) + 'px';
  goals = L.goals;
  document.getElementById('lvlLabel').textContent =
    'Level ' + (i + 1) + ' / ' + LEVELS.length + ' · ' + L.name;
  reset();
}

function reset(){
  const L = LEVELS[li];
  walkers = L.walkers.map((w, k) => ({x:w.x, y:w.y, s:w.s, vx:w.x, vy:w.y, k}));
  history = []; moves = 0; state = 'play'; demo = null;
  say('Optimal is ' + LEVELS[li].par + ' moves.');
  buildRoster();
}

function say(t){ document.getElementById('msg').textContent = t; }

function buildRoster(){
  const host = document.getElementById('roster');
  host.innerHTML = '';
  const NAMES = ['as pressed', '90° clockwise', '180° reversed', '90° anticlockwise'];
  walkers.forEach(w => {
    const el = document.createElement('div');
    el.className = 'who';
    el.innerHTML = '<i style="background:' + COLORS[w.k] + '"></i>' + NAMES[w.s];
    host.appendChild(el);
  });
}

function step(d){
  if (state !== 'play') return;
  const snap = walkers.map(w => ({x:w.x, y:w.y, s:w.s}));
  let moved = false, died = false;

  for (const w of walkers){
    const dir = DIRS[(d + w.s) % 4];
    const nx = w.x + dir[0], ny = w.y + dir[1];
    const t = at(nx, ny);
    if (t === '#') continue;                          // this walker is against a wall; it stays
    w.x = nx; w.y = ny; moved = true;
    if (t === 'o') died = true;
    else if (t === '@') w.s = (w.s + 1) % 4;          // pivot: rotate how it reads your input
  }

  if (!moved) return;                                 // nothing happened at all: not a move
  history.push(snap);
  moves++;

  if (died) return die();
  if (walkers.every((w, k) => w.x === goals[k].x && w.y === goals[k].y)) win();
  else buildRoster();
}

function win(){
  state = 'won';
  const par = LEVELS[li].par;
  say(moves === par ? 'Solved in ' + moves + ' — that is optimal.'
                    : 'Solved in ' + moves + '. Optimal is ' + par + '.');
}

function die(){
  state = 'dead'; shake = 1;
  say('A walker fell. Resetting…');
  setTimeout(() => { if (state === 'dead') reset(); }, 750);
}

function undo(){
  if (state !== 'play' || !history.length) return;
  const snap = history.pop();
  walkers.forEach((w, k) => { w.x = snap[k].x; w.y = snap[k].y; w.s = snap[k].s; });
  moves++;
  buildRoster();
}

/* replay the solver's optimal line */
function showSolution(){
  if (demo) return;
  reset();
  const seq = LEVELS[li].sol.split('');
  say('Replaying the optimal ' + seq.length + '-move solution…');
  let i = 0;
  demo = setInterval(() => {
    if (i >= seq.length || state !== 'play'){ clearInterval(demo); demo = null; return; }
    step('URDL'.indexOf(seq[i++]));
  }, 420);
}

/* ---------- draw ---------- */
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

function chevron(cx, cy, dir, r, color){
  const a = [-Math.PI/2, 0, Math.PI/2, Math.PI][dir];
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(a);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(r, 0); ctx.lineTo(r - 9, -7); ctx.lineTo(r - 9, 7);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function draw(t){
  for (const w of walkers){
    w.vx += (w.x - w.vx) * 0.35; w.vy += (w.y - w.vy) * 0.35;
    if (Math.abs(w.x - w.vx) < 0.001) w.vx = w.x;
    if (Math.abs(w.y - w.vy) < 0.001) w.vy = w.y;
  }

  ctx.save();
  if (shake > 0){
    ctx.translate((Math.random()-.5)*12*shake, (Math.random()-.5)*12*shake);
    shake = Math.max(0, shake - 0.05);
  }
  ctx.fillStyle = '#0c0e14';
  ctx.fillRect(-20, -20, cv.width + 40, cv.height + 40);

  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
    const X = x*CELL, Y = y*CELL, c = at(x,y);
    if (c === '#'){
      ctx.fillStyle = '#191d28'; roundRect(X+2, Y+2, CELL-4, CELL-4, 5); ctx.fill();
      continue;
    }
    ctx.fillStyle = '#141824'; roundRect(X+3, Y+3, CELL-6, CELL-6, 6); ctx.fill();
    ctx.strokeStyle = '#1e2433'; ctx.lineWidth = 1.5; ctx.stroke();

    if (c === 'o'){
      ctx.fillStyle = '#05060a';
      ctx.beginPath(); ctx.arc(X+CELL/2, Y+CELL/2, CELL*0.33, 0, 6.29); ctx.fill();
      ctx.strokeStyle = '#2a3040'; ctx.lineWidth = 2; ctx.stroke();
    }
    if (c === '@'){
      ctx.strokeStyle = '#6b7688'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(X+CELL/2, Y+CELL/2, 15, 0.5, 5.2); ctx.stroke();
      chevron(X+CELL/2 + 4, Y+CELL/2 - 15, 1, 8, '#6b7688');
    }
  }

  // goal pads
  goals.forEach((g, k) => {
    const X = g.x*CELL + CELL/2, Y = g.y*CELL + CELL/2;
    const home = walkers[k] && walkers[k].x === g.x && walkers[k].y === g.y;
    ctx.strokeStyle = COLORS[k];
    ctx.globalAlpha = home ? 1 : 0.55;
    ctx.lineWidth = home ? 4 : 2.5;
    ctx.setLineDash(home ? [] : [5, 5]);
    ctx.beginPath(); ctx.arc(X, Y, CELL*0.32, 0, 6.29); ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
  });

  // walkers
  walkers.forEach(w => {
    const X = w.vx*CELL + CELL/2, Y = w.vy*CELL + CELL/2;
    ctx.shadowBlur = 14; ctx.shadowColor = COLORS[w.k];
    ctx.fillStyle = COLORS[w.k];
    ctx.beginPath(); ctx.arc(X, Y, CELL*0.24, 0, 6.29); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#0c0e14';
    ctx.beginPath(); ctx.arc(X, Y, CELL*0.10, 0, 6.29); ctx.fill();
    // which way this walker reads "up"
    chevron(X, Y, w.s, CELL*0.42, COLORS[w.k]);
  });

  if (state === 'won'){
    ctx.fillStyle = 'rgba(74,222,128,.10)';
    ctx.fillRect(0, 0, cv.width, cv.height);
  }

  ctx.restore();
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

/* ---------- input ---------- */
const KEYS = {
  ArrowUp:0, w:0, W:0, ArrowRight:1, d:1, D:1,
  ArrowDown:2, s:2, S:2, ArrowLeft:3, a:3, A:3
};

addEventListener('keydown', e => {
  if (KEYS[e.key] !== undefined){ e.preventDefault(); step(KEYS[e.key]); return; }
  if (e.key === 'z' || e.key === 'Z') undo();
  if (e.key === 'r' || e.key === 'R') reset();
  if ((e.key === 'n' || e.key === 'N' || e.key === 'Enter') && state === 'won' && li < LEVELS.length-1)
    loadLevel(li + 1);
});

let swipe = null;
cv.addEventListener('pointerdown', e => {
  swipe = {x:e.clientX, y:e.clientY};
  cv.setPointerCapture(e.pointerId);
  e.preventDefault();
});
cv.addEventListener('pointercancel', () => { swipe = null; });
cv.addEventListener('pointerup', e => {
  if (!swipe) return;
  const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
  swipe = null;
  if (Math.hypot(dx, dy) < 24){
    if (state === 'won' && li < LEVELS.length - 1) loadLevel(li + 1);
    return;
  }
  if (Math.abs(dx) > Math.abs(dy)) step(dx > 0 ? 1 : 3);
  else                             step(dy > 0 ? 2 : 0);
});

document.getElementById('undoBtn').onclick = undo;
document.getElementById('resetBtn').onclick = reset;
document.getElementById('solveBtn').onclick = showSolution;

loadLevel(0);
</script>
</body>
</html>
